name: Scrape Meet Entries

on:
  # Run Thursday and Friday at 10 PM UTC (4-5 PM EST)
  # Catches entries posted before weekend meets
  schedule:
    - cron: '0 22 * * 4,5'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      meet_id:
        description: 'Specific meet ID (optional)'
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scrapers
          npm install

      - name: Run entries scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scrapers/entries
          if [ -n "${{ github.event.inputs.meet_id }}" ]; then
            node entries_scraper.js ${{ github.event.inputs.meet_id }}
          else
            node entries_scraper.js
          fi

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entries-logs-${{ github.run_number }}
          path: scrapers/logs/
          retention-days: 14
