name: Sync Weekend Results

on:
  # Run at 4 AM and 2 PM UTC Monday (10 PM/8 AM CST; 11 PM/9 AM CDT)
  schedule:
    - cron: '0 4 * * 1'
    - cron: '0 14 * * 1'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to look back'
        required: false
        default: '7'
        type: string

jobs:
  sync-results:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    concurrency:
      group: trackhub-production-writer
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scrapers/package-lock.json

      - name: Install dependencies
        run: |
          cd scrapers
          npm ci

      - name: Refresh completed meet result links
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scrapers/meets
          node discover_meets.js last_week

      - name: Refresh meet lifecycle statuses
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scrapers/meets/update_meet_status.js

      - name: Sync weekend results from every available provider
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.days || '7' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
        run: |
          if [ -z "${INGEST_DATABASE_URL:-}" ]; then
            echo "::error::INGEST_DATABASE_URL is required; uncontrolled result writes are disabled."
            exit 1
          fi
          cd scrapers/results
          set -o pipefail
          node sync-dual-source-results.js --days "$LOOKBACK_DAYS" --commit 2>&1 | tee sync.log

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-logs-${{ github.run_number }}
          path: scrapers/results/sync.log
          retention-days: 30
