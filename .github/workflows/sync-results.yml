name: Sync Weekend Results

on:
  # Run Sunday at 10 PM and Monday at 8 AM Central (gives TFRRS time to post results)
  schedule:
    - cron: '0 4 * * 1'   # Monday 4 AM UTC = Sunday 10 PM Central
    - cron: '0 14 * * 1'  # Monday 2 PM UTC = Monday 8 AM Central

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to look back'
        required: false
        default: '7'
        type: string

jobs:
  sync-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scrapers
          npm install

      - name: Refresh completed meet result links
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scrapers/meets
          node scrape_meets_github.js last_week

      - name: Sync weekend results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scrapers/tfrrs/meet-scraper
          node sync-weekend-results.js --days ${{ github.event.inputs.days || '7' }} --commit 2>&1 | tee sync.log

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-logs-${{ github.run_number }}
          path: scrapers/tfrrs/meet-scraper/sync.log
          retention-days: 30
