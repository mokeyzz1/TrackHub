name: Validate backend

on:
  push:
    branches: [backend-rebuild]
  pull_request:
    branches: [backend-rebuild]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scrapers/package-lock.json

      - name: Install scraper dependencies
        working-directory: scrapers
        run: npm ci

      - name: Run ingestion contract tests
        env:
          # Unit tests must not require or contact production Supabase.
          SUPABASE_URL: http://127.0.0.1:1
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: npm run test:ingestion

      - name: Validate schema tracking and source safeguards
        run: |
          npm run test:database-history
          npm run test:source-evidence
          npm run test:source-corrections
          npm run test:workflow-safety

      - name: Parse every scraper module
        run: |
          find scrapers -type f -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Check patch whitespace
        run: git diff --check

  postgres-contracts:
    runs-on: ubuntu-latest
    container: postgres:17.11-bookworm
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scrapers/package-lock.json
      - name: Install scraper dependencies
        working-directory: scrapers
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci
      - name: Run isolated PostgreSQL contracts without production credentials
        env:
          # Dependencies are intentionally installed from the scraper lockfile.
          NODE_PATH: ${{ github.workspace }}/scrapers/node_modules
        run: bash docs/database-audit/run_isolated_postgres_tests.sh
