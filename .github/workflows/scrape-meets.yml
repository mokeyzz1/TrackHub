name: Scrape College Meets

on:
  # Run Monday, Thursday, and Friday at 6 AM UTC
  # Friday run catches timing URLs posted right before weekend meets
  schedule:
    - cron: '0 6 * * 1,4,5'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      scope:
        description: 'Scrape scope'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - this_week
          - next_week
          - next_month

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scrapers
          npm install

      - name: Run meets scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scrapers/meets
          node scrape_meets_github.js ${{ github.event.inputs.scope || 'all' }}

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-logs-${{ github.run_number }}
          path: scrapers/meets/logs/
          retention-days: 30
