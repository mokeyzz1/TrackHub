name: Scrape College Meets

on:
  # GitHub cron is UTC. Wake at both possible UTC hours; the Central-time gate runs exactly at
  # 6 AM America/Chicago in either CST or CDT.
  # Friday run catches timing URLs posted right before weekend meets
  schedule:
    - cron: '0 11,12 * * 1,4,5'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      scope:
        description: 'Scrape scope'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - this_week
          - next_week
          - next_month

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    concurrency:
      group: trackhub-production-writer
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Central schedule
        id: central-schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=$(node .github/scripts/central-schedule-gate.js meet-discovery)" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.central-schedule.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scrapers/package-lock.json

      - name: Install dependencies
        if: steps.central-schedule.outputs.run == 'true'
        run: |
          cd scrapers
          npm ci

      - name: Run meets scraper
        if: steps.central-schedule.outputs.run == 'true'
        env:
          MEET_SCRAPE_SCOPE: ${{ github.event.inputs.scope || 'all' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scrapers/meets
          node discover_meets.js "$MEET_SCRAPE_SCOPE"

      - name: Upload logs
        if: always() && steps.central-schedule.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ github.run_number }}
          path: scrapers/meets/logs/
          retention-days: 30
