name: Scrape College Meets

on:
  # Run Monday, Thursday, and Friday at 6 AM Central (12 PM UTC)
  # Friday run catches timing URLs posted right before weekend meets
  schedule:
    - cron: '0 12 * * 1,4,5'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      scope:
        description: 'Scrape scope'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - this_week
          - next_week
          - next_month

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    concurrency:
      group: trackhub-production-writer
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scrapers/package-lock.json

      - name: Install dependencies
        run: |
          cd scrapers
          npm ci

      - name: Run meets scraper
        env:
          MEET_SCRAPE_SCOPE: ${{ github.event.inputs.scope || 'all' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scrapers/meets
          node scrape_meets_github.js "$MEET_SCRAPE_SCOPE"

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-logs-${{ github.run_number }}
          path: scrapers/meets/logs/
          retention-days: 30
