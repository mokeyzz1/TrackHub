name: Update Athlete Rosters

on:
  # Run weekly on Tuesday at 6 AM UTC
  schedule:
    - cron: '0 6 * * 2'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-rosters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: |
          cd scrapers
          npm install

      - name: Install Python dependencies
        run: |
          cd scrapers/rosters
          pip install -r requirements.txt

      - name: Install Puppeteer browser
        run: |
          cd scrapers
          npx puppeteer browsers install chrome

      - name: Scrape rosters from TFRRS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scrapers/rosters
          python scrape_rosters.py

      - name: Generate diff from baseline
        run: |
          cd scrapers/rosters
          python generate_diff.py

      - name: Upload new athletes to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scrapers/rosters
          node fix_and_upload_new_athletes.js || echo "No new athletes to upload"

      - name: Upload logs and output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roster-update-${{ github.run_number }}
          path: |
            scrapers/rosters/logs/
            scrapers/rosters/output/
          retention-days: 30
