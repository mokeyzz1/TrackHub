name: Check Live Meet Status

on:
  # Run hourly on Wed/Thu/Fri/Sat/Sun during meet hours (8 AM - 11 PM Central)
  # Central to UTC: add 6 hours (winter)
  schedule:
    - cron: '0 14-23 * * 3,4,5,6,0'  # 8 AM - 5 PM Central (Wed-Sun)
    - cron: '0 0-5 * * 4,5,6,0,1'    # 6 PM - 11 PM Central (next day UTC)
    - cron: '0 12 * * *'              # Daily at 6 AM Central - catch anything missed

  # Allow manual trigger
  workflow_dispatch:

jobs:
  check-status:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    concurrency:
      group: trackhub-production-writer
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scrapers/package-lock.json

      - name: Update meet statuses
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scrapers
          npm ci
          cd ..
          node scrapers/meets/update_meet_status.js

      - name: Log summary
        run: echo "Meet status update completed at $(date)"
