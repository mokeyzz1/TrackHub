name: Check Live Meet Status

on:
  # GitHub cron is UTC. Candidate hours cover CST and CDT; the Central-time gate removes the
  # extra invocation and preserves the intended local schedule through clock changes.
  schedule:
    - cron: '0 11,12 * * *'            # Daily 6 AM Central candidates
    - cron: '0 13-23 * * 3,4,5,6,0'   # Wed-Sun meet-hour candidates
    - cron: '0 0-5 * * 4,5,6,0,1'     # Wed-Sun evening candidates after UTC rollover

  # Allow manual trigger
  workflow_dispatch:

jobs:
  check-status:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    concurrency:
      group: trackhub-production-writer
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Central schedule
        id: central-schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=$(node .github/scripts/central-schedule-gate.js meet-lifecycle)" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.central-schedule.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scrapers/package-lock.json

      - name: Update meet statuses
        if: steps.central-schedule.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          cd scrapers
          npm ci
          cd ..
          node scrapers/meets/update_meet_status.js

      - name: Log summary
        if: steps.central-schedule.outputs.run == 'true'
        run: echo "Meet status update completed at $(date)"
